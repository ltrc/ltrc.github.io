name: "Speech Processing Lab"
slug: speech-processing
tagline: "Speech and Spoken Language Technologies"
description: "Building speech systems for recognition, synthesis and retrieval in Indian languages."
icon: "speech"

overview:
  about: |
    The Speech Processing Lab (SPL) conducts goal-led research in speech and spoken language technologies, with a focus on Indian languages. The lab builds intelligent systems for automatic speech recognition (ASR), text-to-speech synthesis (TTS), speech translation, spoken and audio retrieval, speech biometrics, speaker and language identification, and emotion recognition, including a phonetic engine and secure voice-based access to information. Its research addresses the challenges of multilinguality, diverse accents, low-resource languages, and real-world acoustic conditions. By combining fundamental research with practical applications, the lab aims to build accessible and inclusive speech technologies for education, healthcare, digital governance, and human-computer interaction.

  highlights:
    - "2026: 3 papers accepted at IEEE ICASSP 2026"
    - "2026: 3 papers accepted at INTERSPEECH 2026"
    - "2026: 3 papers accepted at APSIPA 2026"
    - "2026: 4 papers accepted at IEEE SPCOM 2026"

research_areas:
  - title: "Low-Resource and Domain-Specific ASR"
    description: "Speech recognition for Indian languages with little labelled data, using cross-lingual transfer, unlabelled and synthetic data, and adaptation to domains such as medicine."
  - title: "Robust Speech Recognition"
    description: "ASR that holds up under noise, accent variation and real-world recording conditions, including noise-robust front ends."
  - title: "Speech Translation"
    description: "Speech-to-text and speech-to-speech translation for Indian languages, including weakly supervised training and stress transfer across languages."
  - title: "Text-to-Speech and Speech Quality Assessment"
    description: "Natural, controllable TTS for Indian and indigenous languages, and automatic MOS prediction for evaluating synthesized speech."
  - title: "Prosody, Stress and Pronunciation Assessment"
    description: "Lexical, syllable and sentence stress detection, prosodic prominence, and pronunciation assessment for second-language learners."
  - title: "Pathological and Clinical Speech"
    description: "Stuttering detection, dysarthria detection and intelligibility assessment, and voice-based markers for conditions such as Parkinson's disease."
  - title: "Spoken Language Understanding"
    description: "Spoken question answering, keyword spotting and wake-word detection, with benchmarks for Indian languages."
  - title: "Speaker and Language Recognition"
    description: "Speaker verification and identification, spoken language identification, and voice localization."
  - title: "Emotion Recognition"
    description: "Emotion detection from speech and emotion-aware speech conversion."
  - title: "Speech Corpora and Tools"
    description: "Building open datasets, benchmarks and tools for Indian-language speech, such as IIITH-CSTD, TeluguST-46 and Waveform-Wizard."
